name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify python3
        run: python3 --version
      - name: Run bump tests
        run: bash tests/run-tests.sh
